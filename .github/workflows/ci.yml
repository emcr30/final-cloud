# Integración continua de CanchaYa.
# En cada push o pull request a main: compila y revisa el frontend, corre las
# pruebas del backend y construye la imagen Docker. Si algo falla, GitHub lo
# marca en rojo. El despliegue lo hacen Vercel y Render automáticamente al
# detectar el push (están conectados al repositorio).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Valores de relleno: el build solo los incrusta, no se conecta a nada
      VITE_SUPABASE_URL: https://ejemplo.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci
      VITE_API_URL: https://ejemplo.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Sin secretos: las pruebas no llaman a Supabase, Stripe ni Resend reales
      - run: pytest -q

  docker:
    name: Imagen Docker del backend
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t canchaya-api:ci backend
      - name: Probar que arranca y responde /health
        run: |
          docker run -d --name api -p 8000:8000 canchaya-api:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
